<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title">
  <title id="title">Artisan Ledger Icon</title>
  <style>
    :root {
      --sheet-bg: #FAF8F5;
      --ink: #212224;
      --accent: #2B4C3F;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --sheet-bg: #18191D;
        --ink: #F0EBE1;
        --accent: #9ABBA8;
      }
    }
    .sheet { fill: var(--sheet-bg); stroke: var(--ink); }
    .rules { stroke: var(--ink); }
    .mark { stroke: var(--accent); }
  </style>
  <path class="sheet" d="M25 14h48l30 30v70H25z M73 15v30h29" stroke-width="5" stroke-linecap="square" stroke-linejoin="miter"/>
  <path class="rules" d="M42 60h44 M42 75h44 M42 90h27" fill="none" stroke-width="4" stroke-linecap="square"/>
  <path class="mark" d="m75 99 7 7 14-17" fill="none" stroke-width="5" stroke-linecap="square" stroke-linejoin="miter"/>
</svg>
